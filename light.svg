      <rect x="828" y="379" width="91" height="24" rx="7" fill="#F7FBFF" stroke="#C8DCEB"/><text x="873.5" y="395" fill="#12283C" text-anchor="middle">CHROMADB</text>
      <rect x="927" y="379" width="64" height="24" rx="7" fill="#F7FBFF" stroke="#C8DCEB"/><text x="959" y="395" fill="#12283C" text-anchor="middle">GROQ</text>
