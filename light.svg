<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">V Bablu Nayak — Computer Science Undergraduate at IIT Madras</title>
  <desc id="desc">A terminal-inspired engineering profile showing a path from digital logic and computer systems to AI applications, along with selected technologies and projects.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="1" stop-color="#EAF3FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7052D9"/>
      <stop offset=".52" stop-color="#087E9A"/>
      <stop offset="1" stop-color="#13845F"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".2" cy=".2" r=".9">
      <stop offset="0" stop-color="#7052D9" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7052D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D6E5F0" stroke-width="1" opacity=".62"/>
    </pattern>
    <clipPath id="leftClip"><rect x="32" y="78" width="390" height="500" rx="18"/></clipPath>
    <clipPath id="rightClip"><rect x="438" y="78" width="710" height="500" rx="18"/></clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8CA6BA" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1164" height="594" rx="26" fill="url(#background)" stroke="#C8DCEB" stroke-width="1.2"/>
  <rect x="8" y="8" width="1164" height="594" rx="26" fill="url(#grid)" opacity=".52"/>
  <circle cx="170" cy="92" r="290" fill="url(#ambient)">
    <animate attributeName="opacity" values=".72;1;.72" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1075" cy="515" r="230" fill="#087E9A" opacity=".045">
    <animate attributeName="opacity" values=".025;.07;.025" dur="12s" repeatCount="indefinite"/>
  </circle>

