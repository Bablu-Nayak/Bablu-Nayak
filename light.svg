  <circle cx="64" cy="40" r="5" fill="#F6C85F"/>
  <circle cx="82" cy="40" r="5" fill="#56C98D"/>
  <text x="104" y="45" fill="#50677C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">bablu@iitm: ~/profile</text>
  <text x="910" y="44" fill="#71879A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.2">GITHUB PROFILE</text>
