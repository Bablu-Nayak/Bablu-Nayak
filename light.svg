      <rect x="543" y="379" width="76" height="24" rx="7" fill="#F7FBFF" stroke="#C8DCEB"/><text x="581" y="395" fill="#12283C" text-anchor="middle">PYTHON</text>
      <rect x="627" y="379" width="91" height="24" rx="7" fill="#F7FBFF" stroke="#C8DCEB"/><text x="672.5" y="395" fill="#12283C" text-anchor="middle">ASSEMBLY</text>
